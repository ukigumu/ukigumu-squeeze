name: Release DMG

on:
  pull_request:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (for example v0.1.0). Leave empty to use v1.0.0."
        required: false
        type: string
      publish:
        description: "Create or update the GitHub Release after a successful DMG build"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          set -eu
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          elif [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            TAG="v0.0.0-pr"
          else
            TAG="v1.0.0"
          fi
          case "$TAG" in
            v*) ;;
            *) TAG="v$TAG" ;;
          esac
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved $TAG ($VERSION)"

      - name: Build Release DMG
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: make dmg

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: UkigumuSqueeze-${{ steps.version.outputs.version }}.dmg
          path: dist/UkigumuSqueeze-${{ steps.version.outputs.version }}.dmg
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.publish) }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          DMG="dist/UkigumuSqueeze-${VERSION}.dmg"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DMG" --clobber
            echo "Updated existing release $TAG"
          else
            gh release create "$TAG" "$DMG" \
              --title "Ukigumu Squeeze $VERSION" \
              --generate-notes
            echo "Created release $TAG"
          fi
